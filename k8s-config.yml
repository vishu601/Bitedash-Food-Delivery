apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitedash-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitedash
  template:
    metadata:
      labels:
        app: bitedash
    spec:
      containers:
      - name: bitedash
        image: bitedash-project-web:latest
        imagePullPolicy: IfNotPresent  # Agar 'Never' ya kuch aur ho toh ise 'IfNotPresent' ya hata dena
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: bitedash-service
spec:
  type: NodePort
  selector:
    app: bitedash
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30007
