<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteDash - Food Delivery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-100 min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
        <a href="{% url 'menu' %}" class="text-2xl font-black text-orange-600">🍔 BiteDash</a>
        <div class="space-x-4 flex items-center">
            <a href="{% url 'menu' %}" class="text-gray-700 font-semibold hover:text-orange-600">Menu</a>
            <a href="{% url 'cart' %}" class="bg-orange-100 text-orange-700 px-4 py-2 rounded-xl font-bold hover:bg-orange-200 transition">🛒 Cart</a>
            
            {% if request.user.is_authenticated %}
                <span class="text-gray-800 font-bold">👋 Hi, {{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="text-red-600 font-bold hover:underline">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="bg-orange-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-orange-700 transition">Login</a>
                <a href="{% url 'signup' %}" class="text-gray-700 font-semibold">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-8 px-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html># this change
