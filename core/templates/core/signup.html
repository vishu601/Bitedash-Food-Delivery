{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-md border border-gray-100">
    <h2 class="text-2xl font-black text-gray-900 mb-6 text-center">Create BiteDash Account 🚀</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700 transition">Sign Up</button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">Already have an account? <a href="{% url 'login' %}" class="text-orange-600 font-bold">Login</a></p>
</div>
{% endblock %}
